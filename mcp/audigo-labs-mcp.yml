generated: '2026-07-18'
method: searched
status: published
source: https://www.audigolabs.com/llms.txt
discovery: https://www.audigolabs.com/.well-known/ucp
note: >-
  Audigo Labs publishes no first-party developer API. Its Shopify storefront
  implements the Universal Commerce Protocol (UCP, https://ucp.dev) for
  agent-driven commerce and advertises a live hosted MCP server for buying
  agents. The endpoint is the platform (Shopify) UCP shopping service exposed at
  Audigo's own host; tools/list requires an agent-profile handshake. The tool
  surface below is documented verbatim in the store's /llms.txt "Typical Agent
  Flow". This is a commerce (buy-for-me) MCP server, not a developer API.
server:
  name: audigo-ucp-shopping
  protocol: universal-commerce-protocol
  ucp_version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  transport: http
  url: https://www.audigolabs.com/api/ucp/mcp
  spec: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  auth: agent-profile-required
tools:
- name: search_catalog
  description: Find products in the store matching the buyer's intent.
  source: llms.txt
- name: create_cart
  description: Create a cart and add desired items.
  source: llms.txt
- name: create_checkout
  description: Start the purchase flow for the cart.
  source: llms.txt
- name: update_checkout
  description: Set shipping address and method on the checkout.
  source: llms.txt
- name: complete_checkout
  description: Finalize the purchase; the buyer must approve payment.
  source: llms.txt
