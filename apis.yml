aid: audigo-labs
name: Audigo Labs
description: >-
  Audigo Labs is a San Francisco consumer audio company, founded in 2019 by
  former Tesla engineer and drummer Armen Nazarian, that makes a pocket-sized
  mobile recording studio: wireless smart microphones paired with the Audigo
  iOS and Android app for multi-track recording, multi-mic capture, automatic
  clip correction, editing, remote collaboration, live streaming, and sharing.
  The company sells its hardware and Studio subscription plans through a
  Shopify-hosted storefront at audigolabs.com and supports customers through a
  Zendesk help center. Audigo publishes no first-party developer API; its
  public agent-facing surface is the Shopify commerce platform — a Universal
  Commerce Protocol (UCP) merchant profile with a live buy-for-me MCP endpoint,
  OpenID Connect / OAuth authorization-server discovery for Shopify Customer
  Accounts, and an /llms.txt agent-shopping guide. Added to the API Evangelist
  network as a Techstars portfolio company.
